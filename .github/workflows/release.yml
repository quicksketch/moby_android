# Builds a signed app bundle (for Google Play) and APK when a GitHub release
# is published, and attaches both to the release.
#
# The release's tag sets the version, and must look like v1.2.3 or 1.2.3.
# The version code is major × 1,000,000 + minor × 1,000 + patch, so it rises
# with every release, as Google Play requires.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  The upload keystore: base64 -w0 moby-upload.jks
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  Its password
#   ANDROID_UPLOAD_KEY_ALIAS  The key's alias, such as "upload"
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Caches Gradle's downloads. gradle/actions/setup-gradle isn't used,
      # since from v6 its caching is under a separate, non-open-source license.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Work out the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The release tag \"$TAG\" must look like v1.2.3."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo "::error::Minor and patch versions must be below 1000."
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Set the ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD and ANDROID_UPLOAD_KEY_ALIAS secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the signed bundle and APK
        env:
          MOBY_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          MOBY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          MOBY_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: >-
          ./gradlew bundleRelease assembleRelease
          -PmobyVersionCode=${{ steps.version.outputs.code }}
          -PmobyVersionName=${{ steps.version.outputs.name }}

      - name: Check the signatures
        id: signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          echo "sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)" >> "$GITHUB_OUTPUT"
          # Not -strict: Android signing keys are self-signed, which it rejects.
          if ! jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q '^jar verified'; then
            echo "::error::The app bundle is not signed."
            exit 1
          fi

      - name: Attach the bundle and APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/moby-android-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/moby-android-$VERSION.apk"
          gh release upload "$TAG" dist/* --clobber

      - name: Write the build summary
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CERT_SHA256: ${{ steps.signature.outputs.sha256 }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          aab="moby-android-$VERSION.aab"
          apk="moby-android-$VERSION.apk"
          {
            echo "## Moby for Android $VERSION"
            echo
            echo "Attached to [release $TAG]($RELEASE_URL). Version name \`$VERSION\`, version code \`$VERSION_CODE\`."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in "dist/$aab" "dist/$apk"; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "Both are signed with the upload key, whose certificate's SHA-256 fingerprint is \`$CERT_SHA256\`."
            echo
            echo "### \`$aab\`: for Google Play"
            echo
            echo "1. Download \`$aab\` from the release."
            echo "2. In the [Google Play Console](https://play.google.com/console), open Moby, then **Test and release**."
            echo "3. Choose a track (**Internal testing** first, then **Closed testing** or **Production**) and **Create new release**."
            echo "4. Upload the \`.aab\` under **App bundles**, add release notes, then **Next** and **Save and publish**."
            echo
            echo "Google Play re-signs the app with its app signing key. Each upload needs a higher version code than the last, which a higher version tag gives."
            echo
            echo "### \`$apk\`: for installing directly"
            echo
            echo "- **On a phone:** download \`$apk\` from the release in the browser and open it. Allow the browser to install unknown apps when asked."
            echo "- **With adb:** \`adb install -r $apk\` installs or updates it on a phone connected by USB."
            echo
            echo "The APK is signed with the upload key, not Google Play's key. It can't update a copy installed from Google Play, nor can Google Play update it. Uninstall one to switch to the other, which deletes the app's saved sites and logins."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
